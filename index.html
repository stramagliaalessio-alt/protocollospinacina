<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>protocollo ovetto✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #090314;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Sfondo psikedelico ultra acceso */
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 0, 128, 0.45) 0%, rgba(120, 0, 255, 0.3) 40%, transparent 70%);
      animation: moveGlow 8s infinite alternate ease-in-out;
      z-index: 0;
      filter: blur(70px);
    }

    @keyframes moveGlow {
      0% { transform: translate(-120px, -120px) scale(1); }
      100% { transform: translate(120px, 120px) scale(1.3); }
    }

    .particle {
      position: absolute;
      font-size: 22px;
      animation: floatUp 5s infinite linear;
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.6) rotate(360deg); opacity: 0; }
    }

    /* Card con bordi olografici */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 40px 28px;
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1.5px rgba(255, 255, 255, 0.25);
      max-width: 440px;
      width: 90%;
      position: relative;
      z-index: 10;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .slide-anim {
      animation: slideTransition 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideTransition {
      0% { opacity: 0; transform: scale(0.85) translateY(25px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .gif-container {
      margin-bottom: 25px;
      position: relative;
      display: inline-block;
    }

    .gif-container img {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(255, 0, 128, 0.5);
      border: 3.5px solid rgba(255, 255, 255, 0.8);
      animation: floatGif 3s infinite ease-in-out;
    }

    @keyframes floatGif {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    h1 {
      font-size: 1.55rem;
      color: #ffffff;
      margin-bottom: 25px;
      font-weight: 800;
      line-height: 1.35;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      letter-spacing: -0.3px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 10px;
      min-height: 65px;
    }

    .btn {
      padding: 15px 32px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 50px;
      border: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn-next {
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.6);
    }

    .btn-next:active {
      transform: scale(0.95);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff007f 0%, #ff5e62 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.6);
      z-index: 10;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.12);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
    }

    .music-bar {
      margin-top: 25px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ff99dd;
      cursor: pointer;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 30px;
      background: rgba(255, 0, 128, 0.15);
      border: 1.5px solid rgba(255, 153, 221, 0.5);
      transition: 0.3s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.2);
    }

    .music-bar:active {
      transform: scale(0.95);
    }

    /* Confetti esplosivi */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      z-index: 100;
      pointer-events: none;
      animation: fall 3s ease-out forwards;
    }

    @keyframes fall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(720deg); }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="card" id="mainCard">
    <div class="gif-container">
      <img id="gifImage" src="" alt="Iconic Cat">
    </div>

    <h1 id="slideText"></h1>

    <div class="btn-container" id="btnArea"></div>
    <div class="music-bar" id="musicBtn">✨ Tocca per Musica Kawaii ✨</div>
  </div>

  <script>
    // Particelle di sfondo
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.innerHTML = ['✨', '💖', '🔮', '🧸'][Math.floor(Math.random() * 4)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 2 + 4) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 5000);
    }, 350);

    const tuoNumero = "393466297958";
    const messaggioWhatsApp = "BUONASERA SONO MARIACHIARAK E PRETENDO I DOLCETTI CHE MI DEVI";
    const linkWhatsApp = `https://api.whatsapp.com/send?phone=${tuoNumero}&text=${encodeURIComponent(messaggioWhatsApp)}`;

    const frasiNo = [
      "Ma veramente? ",
      "La dieta si fa a luglio! ",
      "Lo sai anche tu che li vuoi ",
      "Chiara... ",
      "NEL CHILL ",
      "NO STRESS "
    ];
    let indiceFrasiNo = 0;
    let scalaSì = 1;

    const slides = [
      {
        gif: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ29sbnp2cHkxeWkwMWk4aXZtaTlqaTRsa2R1bHltYTV4eGo5ajMwZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/31fV3PglscF64FZqeB/giphy.gif",
        text: "Sono un sensitivo... 🧙‍♂️🐱",
        type: "next",
        nextSlide: 1
      },
      {
        gif: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWplZWNsNW5wd3R0djBmdm9icTI3NWlqMmV2cmZzdzN5dHowZDZpaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/nCSNKeaXfpfyZZXDio/giphy.gif",
        text: "...e percepivo un'aura di stress. Sei stressata?",
        type: "choice_stress"
      },
      {
        gif: "https://media3.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3eno5a2lwdTZtcXI1YXA1d3VqZHJ0MG0zYzA5cmRueDdweHV6cWxmNyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3CgrPTmlp0dIQ/giphy.webp",
        text: "Conosco un rimedio infallibile contro lo stress. 💊",
        type: "next",
        nextSlide: 3
      },
      {
        gif: "https://media1.tenor.com/m/j5rPRPBwSOMAAAAd/cat-smacking-other-cat-cat.gif",
        text: "No, non è quello che pensi... cioè sì, ma no. 😼",
        type: "next",
        nextSlide: 4
      },
      {
        gif: "https://media1.tenor.com/m/Ush_FO26Xm4AAAAd/eating-treat-marmalade.gif",
        text: "Ti devo dei dolcetti ansiolitici. Ti vanno? 👨‍🍳🧁",
        type: "final_choice"
      }
    ];

    // ==========================================
    // SINTETIZZATORE AUDIO NATIVO PER SAFARI / IOS
    // (Genera melodie senza bisogno di file MP3)
    // ==========================================
    let audioCtx = null;
    let isPlaying = false;
    let timerMelodia = null;

    const noteMelodia = [
      523.25, 659.25, 783.99, 1046.50, // C5, E5, G5, C6
      880.00, 659.25, 783.99, 1046.50, // A5, E5, G5, C6
      698.46, 880.00, 1046.50, 1318.51 // F5, A5, C6, E6
    ];

    function playKawaiiMelody() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      let step = 0;
      isPlaying = true;
      document.getElementById('musicBtn').innerText = "🔊 Colonna Sonora Kawaii Attiva";

      timerMelodia = setInterval(() => {
        if (!isPlaying) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle'; // Suono stile chiptune/cute
        osc.frequency.setValueAtTime(noteMelodia[step % noteMelodia.length], audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
        
        step++;
      }, 200);
    }

    function toggleAudio() {
      if (!isPlaying) {
        playKawaiiMelody();
      } else {
        isPlaying = false;
        clearInterval(timerMelodia);
        document.getElementById('musicBtn').innerText = "🔈 Musica in Pausa";
      }
    }

    // Sblocco immediato al touch su iOS
    const unlockIOS = () => {
      if (!isPlaying) playKawaiiMelody();
      document.removeEventListener('touchstart', unlockIOS);
      document.removeEventListener('click', unlockIOS);
    };

    document.addEventListener('touchstart', unlockIOS, { once: true });
    document.addEventListener('click', unlockIOS, { once: true });
    document.getElementById('musicBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });

    // Effetto esplosione confetti al SÌ finale
    function esplodiConfetti() {
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.innerText = ['💖', '✨', '🧁', '🌸', '🎉'][Math.floor(Math.random() * 5)];
        c.style.left = '50vw';
        c.style.top = '50vh';
        c.style.setProperty('--dx', (Math.random() * 400 - 200) + 'px');
        c.style.setProperty('--dy', (Math.random() * 400 - 200) + 'px');
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
      }
    }

    function renderSlide(index) {
      const card = document.getElementById('mainCard');
      card.classList.remove('slide-anim');
      void card.offsetWidth;
      card.classList.add('slide-anim');

      const slide = slides[index];
      document.getElementById('gifImage').src = slide.gif;
      document.getElementById('slideText').innerText = slide.text;

      const btnArea = document.getElementById('btnArea');
      btnArea.innerHTML = "";

      if (slide.type === "next") {
        const nextBtn = document.createElement("button");
        nextBtn.className = "btn btn-next";
        nextBtn.innerHTML = "Avanti ➔";
        nextBtn.onclick = () => renderSlide(slide.nextSlide);
        btnArea.appendChild(nextBtn);
      } 
      else if (slide.type === "choice_stress") {
        const yesBtn = document.createElement("button");
        yesBtn.className = "btn btn-yes";
        yesBtn.innerText = "SÌ 😅";
        yesBtn.onclick = () => renderSlide(2);

        const noBtn = document.createElement("button");
        noBtn.className = "btn btn-no";
        noBtn.innerText = "NO 😇";
        noBtn.onclick = () => renderSlide(2);

        btnArea.appendChild(yesBtn);
        btnArea.appendChild(noBtn);
      } 
      else if (slide.type === "final_choice") {
        const yesLink = document.createElement("a");
        yesLink.id = "finalYesBtn";
        yesLink.className = "btn btn-yes";
        yesLink.innerText = "SÌ! 🧁";
        yesLink.href = linkWhatsApp;
        yesLink.target = "_blank";
        yesLink.onclick = () => esplodiConfetti();

        const noBtn = document.createElement("button");
        noBtn.className = "btn btn-no";
        noBtn.innerText = "NO 😅";

        noBtn.onclick = () => {
          document.getElementById('slideText').innerText = frasiNo[indiceFrasiNo % frasiNo.length];
          indiceFrasiNo++;
          scalaSì += 0.35;
          yesLink.style.transform = `scale(${scalaSì})`;
        };

        btnArea.appendChild(yesLink);
        btnArea.appendChild(noBtn);
      }
    }

    renderSlide(0);
  </script>

</body>
</html>
