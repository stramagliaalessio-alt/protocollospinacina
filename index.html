<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>protocollo ovetto✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #08020f;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Sfondo olografico e bagliori al neon */
    .bg-glow-1 {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 0, 128, 0.6) 0%, rgba(255, 0, 212, 0.2) 60%, transparent 80%);
      top: 10%;
      left: 5%;
      filter: blur(60px);
      animation: pulseGlow 6s infinite alternate ease-in-out;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(121, 40, 202, 0.6) 0%, rgba(0, 212, 255, 0.2) 60%, transparent 80%);
      bottom: 10%;
      right: 5%;
      filter: blur(65px);
      animation: pulseGlow 8s infinite alternate-reverse ease-in-out;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      100% { transform: scale(1.3) translate(20px, -20px); opacity: 1; }
    }

    /* Particelle di sfondo ambientali */
    .ambient-particle {
      position: absolute;
      font-size: 20px;
      animation: floatUp 5s infinite linear;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.4) rotate(360deg); opacity: 0; }
    }

    /* Card con effetto Glassmorphism avanzato per Safari iOS */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 38px 24px;
      border-radius: 38px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 
                  inset 0 0 0 1.5px rgba(255, 255, 255, 0.25),
                  0 0 40px rgba(255, 0, 128, 0.2);
      max-width: 380px;
      width: 88%;
      position: relative;
      z-index: 10;
      text-align: center;
      transform-origin: center;
    }

    .slide-anim {
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.75) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .gif-container {
      margin-bottom: 22px;
      position: relative;
      display: inline-block;
    }

    .gif-container img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 0, 128, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.85);
      animation: floatGif 3s infinite ease-in-out;
    }

    @keyframes floatGif {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }

    h1 {
      font-size: 1.45rem;
      color: #ffffff;
      margin-bottom: 22px;
      font-weight: 800;
      line-height: 1.35;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
      letter-spacing: -0.2px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 5px;
      min-height: 65px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.05rem;
      font-weight: 900;
      border-radius: 50px;
      border: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.92) !important;
    }

    .btn-next {
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.55);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff007f 0%, #ff5e62 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.65), 0 0 15px rgba(255, 255, 255, 0.4);
      z-index: 10;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.12);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ESPLOSIONE DI EMOTICON ED EMOJI (DOPAMINE BOMB) */
    .emoji-pop {
      position: fixed;
      font-size: 32px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      animation: burstOut 1.8s cubic-bezier(0.12, 0.8, 0.32, 1) forwards;
    }

    @keyframes burstOut {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.3) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: translate(var(--vx), var(--vy)) scale(1.8) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--vx) * 1.4), calc(var(--vy) * 1.4 + 100px)) scale(0.8) rotate(360deg);
      }
    }
  </style>
</head>

    function esplosioneDopamina() {
      // Vibrazione iPhone/Safari se supportata
      if (navigator.vibrate) {

      for (let i = 0; i < totalEmojis; i++) {

          const velocity = Math.random() * 280 + 120; // Distanza dell'esplosione
          const vx = Math.cos(angle) * velocity + 'px';
          const vy = Math.sin(angle) * velocity + 'px';

          el.style.setProperty('--vx', vx);
          el.style.setProperty('--vy', vy);

          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1800);
        }, i * 12); // Effetto a cascata
      }
