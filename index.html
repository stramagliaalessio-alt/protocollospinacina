<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>protocollo ovetto✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d0614;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    /* Card principale in vetro sfumato */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 35px 25px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .gif-container {
      margin-bottom: 20px;
    }

    .gif-container img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 25px;
      font-weight: 800;
      line-height: 1.4;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      min-height: 60px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 50px;
      border: none;
      transition: transform 0.2s ease, background-color 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-next, .btn-yes {
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4);
      z-index: 10;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="gif-container">
      <img id="gifImage" src="" alt="Cat GIF">
    </div>

    <h1 id="slideText"></h1>

    <div class="btn-container" id="btnArea"></div>
  </div>

  <script>
    const tuoNumero = "393466297958";
    const messaggioWhatsApp = "BUONASERA SONO MARIACHIARAK E PRETENDO I DOLCETTI CHE MI DEVI";
    const linkWhatsApp = `https://api.whatsapp.com/send?phone=${tuoNumero}&text=${encodeURIComponent(messaggioWhatsApp)}`;

    const frasiNo = [
      "Ma veramente?",
      "La dieta si fa a luglio!",
      "Lo sai anche tu che li vuoi",
      "Chiara...",
      "NEL CHILL",
      "NO STRESS"
    ];
    let indiceFrasiNo = 0;
    let scalaSì = 1;

    const slides = [
      {
        gif: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ29sbnp2cHkxeWkwMWk4aXZtaTlqaTRsa2R1bHltYTV4eGo5ajMwZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/31fV3PglscF64FZqeB/giphy.gif",
        text: "Sono un sensitivo...",
        type: "next",
        nextSlide: 1
      },
      {
        gif: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWplZWNsNW5wd3R0djBmdm9icTI3NWlqMmV2cmZzdzN5dHowZDZpaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/nCSNKeaXfpfyZZXDio/giphy.gif",
        text: "...e percepivo un'aura di stress. Sei stressata?",
        type: "choice_stress"
      },
      {
        gif: "https://media3.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3eno5a2lwdTZtcXI1YXA1d3VqZHJ0MG0zYzA5cmRueDdweHV6cWxmNyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3CgrPTmlp0dIQ/giphy.webp",
        text: "Conosco un rimedio infallibile contro lo stress.",
        type: "next",
        nextSlide: 3
      },
      {
        gif: "https://media1.tenor.com/m/j5rPRPBwSOMAAAAd/cat-smacking-other-cat-cat.gif",
        text: "No, non è quello che pensi... cioè sì, ma no.",
        type: "next",
        nextSlide: 4
      },
      {
        gif: "https://media1.tenor.com/m/Ush_FO26Xm4AAAAd/eating-treat-marmalade.gif",
        text: "Ti devo dei dolcetti ansiolitici. Ti vanno?",
        type: "final_choice"
      }
    ];

    function renderSlide(index) {
      const slide = slides[index];
      document.getElementById('gifImage').src = slide.gif;
      document.getElementById('slideText').innerText = slide.text;

      const btnArea = document.getElementById('btnArea');
      btnArea.innerHTML = "";

      if (slide.type === "next") {
        const nextBtn = document.createElement("button");
        nextBtn.className = "btn btn-next";
        nextBtn.innerText = "Avanti ➔";
        nextBtn.onclick = () => renderSlide(slide.nextSlide);
        btnArea.appendChild(nextBtn);
      } 
      else if (slide.type === "choice_stress") {
        const yesBtn = document.createElement("button");
        yesBtn.className = "btn btn-yes";
        yesBtn.innerText = "SÌ";
        yesBtn.onclick = () => renderSlide(2);

        const noBtn = document.createElement("button");
        noBtn.className = "btn btn-no";
        noBtn.innerText = "NO";
        noBtn.onclick = () => renderSlide(2);

        btnArea.appendChild(yesBtn);
        btnArea.appendChild(noBtn);
      } 
      else if (slide.type === "final_choice") {
        const yesLink = document.createElement("a");
        yesLink.id = "finalYesBtn";
        yesLink.className = "btn btn-yes";
        yesLink.innerText = "SÌ!";
        yesLink.href = linkWhatsApp;
        yesLink.target = "_blank";

        const noBtn = document.createElement("button");
        noBtn.className = "btn btn-no";
        noBtn.innerText = "NO";

        noBtn.onclick = () => {
          document.getElementById('slideText').innerText = frasiNo[indiceFrasiNo % frasiNo.length];
          indiceFrasiNo++;
          scalaSì += 0.35;
          yesLink.style.transform = `scale(${scalaSì})`;
        };

        btnArea.appendChild(yesLink);
        btnArea.appendChild(noBtn);
      }
    }

    renderSlide(0);
  </script>

</body>
</html>
